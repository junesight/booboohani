name: SEO/AEO 개선 작업
description: 부부한의원 홈페이지 SEO/AEO 개선 항목
title: "[SEO-000] "
labels:
  - seo
type: Task
body:
  - type: markdown
    attributes:
      value: |
        한 Issue에는 독립적으로 검증할 수 있는 한 가지 작업만 작성합니다.

  - type: input
    id: task_id
    attributes:
      label: 작업 ID
      placeholder: SEO-003
    validations:
      required: true

  - type: textarea
    id: purpose
    attributes:
      label: 목적
      description: 왜 이 작업이 필요한지 작성하세요.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 수정할 기능과 파일 범위를 작성하세요.
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: 완료 조건
      description: 실제로 검증할 수 있는 조건을 체크리스트로 작성하세요.
      value: |
        - [ ] 구현 완료
        - [ ] 로컬 검증 완료
        - [ ] 운영 배포 후 확인 완료
    validations:
      required: true

  - type: textarea
    id: out_of_scope
    attributes:
      label: 작업하지 않을 범위
      description: 이번 작업에 섞지 않을 내용을 작성하세요.

  - type: textarea
    id: verification
    attributes:
      label: 검증 방법
      description: 명령어, URL, 브라우저, 테스트 방법을 작성하세요.
    validations:
      required: true

  - type: dropdown
    id: risk
    attributes:
      label: 위험도
      options:
        - 낮음 — 문서·독립 콘텐츠
        - 보통 — 화면·SEO 메타
        - 높음 — 도메인·리디렉션·배포
    validations:
      required: true

  - type: textarea
    id: handoff
    attributes:
      label: 인수인계·주의사항
      description: 다른 컴퓨터나 AI 도구가 알아야 할 내용을 작성하세요.
